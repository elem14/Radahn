syntax = "proto3";

package radahn.rpc.v1;

import "client_service.proto";

service WorkerService {
  rpc RegisterWorker(RegisterWorkerRequest)
      returns (RegisterWorkerResponse);
  
  rpc Heartbeat(HeartbeatRequest)
      returns (HeartbeatResponse);

  rpc AcquireJob(AcquireJobRequest)
      returns (AcquireJobResponse);

  rpc StartJob(StartJobRequest)
      returns (StartJobResponse);

  rpc FinishJob(FinishJobRequest)
      returns (FinishJobResponse);
}

message WorkerResources {
  double total_cpu_cores = 1;
  double available_cpu_cores = 2;

  uint64 total_memory_bytes = 3;
  uint64 available_memory_bytes = 4;

  uint64 total_disk_bytes = 5;
  uint64 available_disk_bytes = 6;

  bool gpu_available = 7;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  WorkerResources resources = 2;
  uint64 running_jobs = 3;
  uint64 max_concurrent_jobs = 4;
  repeated string tags = 5;
}

message RegisterWorkerResponse {
  string worker_id = 1;
  bool already_registered = 2;
}

message JobAttempt {
  string job_id = 1;
  uint64 attempt_number = 2;
}

message HeartbeatRequest {
  string worker_id = 1;

  reserved 2;
  reserved "active_job_ids";

  // Job attempts the worker currently considers actively RUNNING on
  // it. The coordinator renews the lease of each matching, running,
  // unexpired attempt independently, so one stuck job does not keep
  // other, healthy jobs alive by association, and does not itself
  // get renewed by another job's heartbeat activity. A worker that
  // only identifies a job by ID (the old protocol) cannot silently
  // fall back to renewing by ID alone; the field type itself forces
  // every caller to supply an attempt number.
  repeated JobAttempt active_attempts = 3;
}

message HeartbeatResponse {
  int64 coordinator_time_unix_ms = 1;

  // The attempts whose leases were actually renewed by this
  // heartbeat, so the worker never infers renewal merely because
  // the RPC returned OK.
  repeated JobAttempt renewed_attempts = 2;

  uint64 lease_duration_ms = 3;
}

message AcquireJobRequest {
  string worker_id = 1;
}

message AcquireJobResponse {
  reserved 1;
  JobInfo job = 2;
}

message StartJobRequest {
  string worker_id = 1;
  string job_id = 2;

  // Attempt 0 is invalid. The worker captures this value from
  // AcquireJobResponse.job.attempt_count and uses the same number
  // for start, renewal, and completion of this attempt.
  uint64 attempt_number = 3;
}

message StartJobResponse {
  JobInfo job = 1;
  uint64 lease_duration_ms = 2;
}

enum JobOutcome {
  JOB_OUTCOME_UNSPECIFIED = 0;
  JOB_OUTCOME_SUCCEEDED = 1;
  JOB_OUTCOME_FAILED = 2;
}

message FinishJobRequest {
  string worker_id = 1;
  string job_id = 2;
  JobOutcome outcome = 3;
  ExecutionResult execution_result = 4;
  uint64 attempt_number = 5;
}

message FinishJobResponse {
  JobInfo job = 1;
}