syntax = "proto3";

package radahn.rpc.v1;

import "client_service.proto";

service WorkerService {
  rpc RegisterWorker(RegisterWorkerRequest)
      returns (RegisterWorkerResponse);
  
  rpc Heartbeat(HeartbeatRequest)
      returns (HeartbeatResponse);

  rpc AcquireJob(AcquireJobRequest)
      returns (AcquireJobResponse);

  rpc StartJob(StartJobRequest)
      returns (StartJobResponse);

  rpc FinishJob(FinishJobRequest)
      returns (FinishJobResponse);
}

message WorkerResources {
  double total_cpu_cores = 1;
  double available_cpu_cores = 2;

  uint64 total_memory_bytes = 3;
  uint64 available_memory_bytes = 4;

  uint64 total_disk_bytes = 5;
  uint64 available_disk_bytes = 6;

  bool gpu_available = 7;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  WorkerResources resources = 2;
  uint64 running_jobs = 3;
  uint64 max_concurrent_jobs = 4;
  repeated string tags = 5;
}

message RegisterWorkerResponse {
  string worker_id = 1;
  bool already_registered = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  int64 coordinator_time_unix_ms = 1;
}

message AcquireJobRequest {
  string worker_id = 1;
}

message AcquireJobResponse {
  reserved 1;
  JobInfo job = 2;
}

message StartJobRequest {
  string worker_id = 1;
  string job_id = 2;
}

message StartJobResponse {
  JobInfo job = 1;
}

enum JobOutcome {
  JOB_OUTCOME_UNSPECIFIED = 0;
  JOB_OUTCOME_SUCCEEDED = 1;
  JOB_OUTCOME_FAILED = 2;
}

message FinishJobRequest {
  string worker_id = 1;
  string job_id = 2;
  JobOutcome outcome = 3;
}

message FinishJobResponse {
  JobInfo job = 1;
}