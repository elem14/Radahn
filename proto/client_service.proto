syntax = "proto3";

package radahn.rpc.v1;

service ClientService {
  rpc Ping(PingRequest)
      returns (PingResponse);

  rpc SubmitJob(SubmitJobRequest)
      returns (SubmitJobResponse);

  rpc GetJob(GetJobRequest)
      returns (GetJobResponse);

  rpc ListJobs(ListJobsRequest)
      returns (ListJobsResponse);

  rpc GetJobLog(GetJobLogRequest)
      returns (GetJobLogResponse);

  rpc ListWorkers(ListWorkersRequest)
      returns (ListWorkersResponse);

  rpc GetWorker(GetWorkerRequest)
      returns (GetWorkerResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string coordinator_version = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_LEASED = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_RETRY_WAIT = 4;
  JOB_STATE_CANCELLATION_REQUESTED = 5;
  JOB_STATE_SUCCEEDED = 6;
  JOB_STATE_FAILED = 7;
  JOB_STATE_CANCELLED = 8;
}

message ResourceRequirements {
  double cpu_cores = 1;
  uint64 memory_bytes = 2;
  uint64 disk_bytes = 3;
  bool requires_gpu = 4;
  repeated string required_tags = 5;
}

enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  WORKLOAD_KIND_SLEEP = 1;
  WORKLOAD_KIND_COMMAND = 2;
}

message CommandWorkload {
  string executable = 1;
  repeated string args = 2;
  optional uint64 timeout_ms = 3;
}

message WorkloadSpec {
  WorkloadKind kind = 1;
  uint64 sleep_duration_ms = 2;
  CommandWorkload command = 3;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

enum ExecutionOutcome {
  EXECUTION_OUTCOME_UNSPECIFIED = 0;
  EXECUTION_OUTCOME_EXITED = 1;
  EXECUTION_OUTCOME_SIGNALED = 2;
  EXECUTION_OUTCOME_SPAWN_FAILED = 3;
  EXECUTION_OUTCOME_WORKER_ERROR = 4;
  EXECUTION_OUTCOME_TIMED_OUT = 5;
  EXECUTION_OUTCOME_WORKER_STOPPED = 6;
}

message ExecutionResult {
  ExecutionOutcome outcome = 1;
  optional int32 exit_code = 2;
  optional int32 terminating_signal = 3;
  string diagnostic = 4;
}

message JobInfo {
  string id = 1;
  string name = 2;
  int32 priority = 3;
  JobState state = 4;
  ResourceRequirements requirements = 5;
  int64 created_at_unix_ms = 6;
  WorkloadSpec workload = 7;
  uint64 attempt_count = 8;
  uint64 max_attempts = 9;
  ExecutionResult execution_result = 10;

  // The worker currently (or, for a terminal job, most recently)
  // assigned to this job. Unset when the job has never been
  // dispatched to any worker.
  optional string assigned_worker_id = 11;

  // Whether a stdout/stderr log has been uploaded for this job's
  // current/latest attempt - never implies the job succeeded, and a
  // successful job is not assumed to have uploaded logs yet.
  bool stdout_log_available = 12;
  bool stderr_log_available = 13;
}

message SubmitJobRequest {
  string id = 1;
  string name = 2;
  int32 priority = 3;
  ResourceRequirements requirements = 4;
  WorkloadSpec workload = 5;
  uint64 max_attempts = 6;
}

message SubmitJobResponse {
  JobInfo job = 1;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  JobInfo job = 1;
}

message ListJobsRequest {
}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
}

message GetJobLogRequest {
  string id = 1;

  // Defaults to LOG_STREAM_STDOUT when unspecified.
  LogStream stream = 2;

  // 0 (the default) means "the job's current/latest attempt".
  uint64 attempt_number = 3;
}

message GetJobLogResponse {
  bytes content = 1;
  uint64 attempt_number = 2;
  uint64 original_byte_count = 3;
  bool truncated = 4;
}

message WorkerInfo {
  string worker_id = 1;
  bool online = 2;

  // 0 when this worker has never heartbeat.
  int64 last_heartbeat_unix_ms = 3;

  double total_cpu_cores = 4;
  double allocated_cpu_cores = 5;

  uint64 total_memory_bytes = 6;
  uint64 allocated_memory_bytes = 7;

  uint64 total_disk_bytes = 8;
  uint64 allocated_disk_bytes = 9;

  uint64 running_jobs = 10;
  uint64 max_concurrent_jobs = 11;

  bool gpu_available = 12;

  repeated string tags = 13;
}

message ListWorkersRequest {
}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message GetWorkerRequest {
  string worker_id = 1;
}

message GetWorkerResponse {
  WorkerInfo worker = 1;
}